<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vanam Valley Group — Premium Residential & Commercial Plots in Balaghat, Madhya Pradesh. Where Nature Meets Your Future." />
    <meta name="keywords" content="Vanam Valley, plots Balaghat, residential plots Balaghat, commercial plots Madhya Pradesh, real estate Balaghat" />
    <meta property="og:title" content="Vanam Valley Group — Premium Plots in Balaghat" />
    <meta property="og:description" content="Premium Residential & Commercial Plots in Balaghat, Madhya Pradesh." />
    <meta property="og:type" content="website" />
    <title>Vanam Valley Group — Premium Plots in Balaghat, M.P.</title>
    <!-- Google Fonts preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #001D18; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif; color: #D8B879;">
        <img src="/logo-gold.png" alt="Vanam Valley" style="height: 80px; width: auto; object-fit: contain; margin-bottom: 24px; animation: vanamPulse 2s ease-in-out infinite;" />
        <div style="width: 180px; height: 2px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, transparent, #D8B879, transparent); position: absolute; animation: vanamBar 1.5s ease-in-out infinite;"></div>
        </div>
        <div style="margin-top: 16px; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(216, 184, 121, 0.85); font-weight: 600;">
          VANAM VALLEY
        </div>
      </div>
      <style>
        @keyframes vanamPulse {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.04); }
        }
        @keyframes vanamBar {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
